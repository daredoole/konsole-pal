[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "konsole-pal"
version = "1.0.0"
description = "A tiny local-first attention router for terminal AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "konsole-pal contributors" }]
dependencies = ["tomli>=2.0; python_version < '3.11'"]
keywords = ["konsole", "codex", "claude", "cursor", "terminal", "agent", "notification"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/daredoole/konsole-pal"
Documentation = "https://github.com/daredoole/konsole-pal#readme"
Issues = "https://github.com/daredoole/konsole-pal/issues"
Changelog = "https://github.com/daredoole/konsole-pal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12", "twine>=6"]

[project.scripts]
konsole-pal = "konsole_pal.cli:main"
kp = "konsole_pal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]
