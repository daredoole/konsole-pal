name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - run: nix flake check --print-build-logs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - name: Static security analysis
        run: uvx bandit -r src -q
      - name: Secret scan
        run: >-
          uvx detect-secrets scan --all-files
          --exclude-files '(^|/)(\.git|\.venv|build|dist|graphify-out|packaging/generated|\.pytest_cache|\.ruff_cache)/'
          | python -c 'import json, sys; data=json.load(sys.stdin); findings=sum(map(len, data["results"].values())); print(f"secret findings: {findings}"); raise SystemExit(findings != 0)'
      - name: Python 3.10 backport dependency audit
        run: uvx --with tomli pip-audit --local --skip-editable

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked --extra dev ruff check src tests scripts
      - run: uv run --locked --extra dev python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --locked --extra dev twine check dist/*

  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - run: uv build --clear
      - run: uv run --locked python scripts/render-packages.py
      - run: ruby -c packaging/generated/konsole-pal.rb
      - run: bash -n packaging/generated/PKGBUILD
      - run: uv venv /tmp/konsole-pal-wheel-smoke
      - run: uv pip install --python /tmp/konsole-pal-wheel-smoke/bin/python dist/*.whl
      - run: /tmp/konsole-pal-wheel-smoke/bin/konsole-pal --version

  multiplexers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: zellij
      - run: KONSOLE_PAL_INTEGRATION=1 uv run --locked python -m unittest tests.test_multiplexer_integration -v
