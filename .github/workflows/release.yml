name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: zellij
      - run: uv run --locked --extra dev ruff check src tests scripts
      - run: uvx bandit -r src -q
      - run: KONSOLE_PAL_INTEGRATION=1 uv run --locked --extra dev python -m unittest discover -s tests -v
      - run: uv build --clear
      - run: uvx twine check dist/*
      - run: uv run --locked python scripts/render-packages.py
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
            packaging/generated/*
          generate_release_notes: true
