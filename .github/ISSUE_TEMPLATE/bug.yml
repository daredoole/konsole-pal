name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove usernames, hostnames, prompts, tokens, and private paths from logs or screenshots.
  - type: input
    id: version
    attributes:
      label: konsole-pal version
      placeholder: Output of konsole-pal --version
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal layer
      options: [Konsole, Zellij, tmux, SSH/OSC, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Paste konsole-pal doctor output only after checking it for private information.
